<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 720 405">
<style>
  .ti{font:700 16px "PingFang SC","Helvetica Neue",sans-serif;fill:#1A2233}
  .h{font:700 13.5px "PingFang SC","Helvetica Neue",sans-serif;fill:#1A2233}
  .b{font:12px "PingFang SC","Helvetica Neue",sans-serif;fill:#1A2233}
  .m{font:11.5px "PingFang SC","Helvetica Neue",sans-serif;fill:#5E6B82}
  .lbl{font:11px "PingFang SC","Helvetica Neue",sans-serif;fill:#888}
  .big{font:700 22px "Helvetica Neue",sans-serif;fill:#4464f0}
  .code{font:11px Menlo,Consolas,monospace;fill:#1A2233}
  .cap{font:11px "PingFang SC","Helvetica Neue",sans-serif;fill:#888}
</style>
<rect width="720" height="405" fill="#FFFFFF"/>
<text x="20" y="28" class="ti">Output Contract：四字段结构化提交映射到三维评分</text>
<line x1="20" y1="38" x2="720" y2="38" stroke="#4464f0" stroke-width="2"/>
<rect x="20" y="60" width="380" height="60" rx="4" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
<rect x="20" y="60" width="6" height="60" fill="#4464f0"/>
<text x="40" y="82" class="code" style="font-weight:700">root_cause_type</text>
<text x="40" y="99" class="lbl">string</text>
<text x="160" y="99" class="m">Agent 判断的故障类型，如 slowSQL</text>
<path d="M 405 90 L 500 90" stroke="#5E6B82" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="510" y="65" width="190" height="50" rx="4" fill="#eef2ff" stroke="#4464f0" stroke-width="1"/>
<text x="605" y="87" text-anchor="middle" class="h" style="fill:#4464f0">Boundary</text>
<text x="605" y="105" text-anchor="middle" class="m">权重 0.4</text>
<rect x="20" y="130" width="380" height="60" rx="4" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
<rect x="20" y="130" width="6" height="60" fill="#4464f0"/>
<text x="40" y="152" class="code" style="font-weight:700">root_cause_entities</text>
<text x="40" y="169" class="lbl">list[string]</text>
<text x="160" y="169" class="m">归一化后的根因 entity_id 列表</text>
<path d="M 405 160 L 500 160" stroke="#5E6B82" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="510" y="135" width="190" height="50" rx="4" fill="#eef2ff" stroke="#4464f0" stroke-width="1"/>
<text x="605" y="157" text-anchor="middle" class="h" style="fill:#4464f0">Cause</text>
<text x="605" y="175" text-anchor="middle" class="m">权重 0.3</text>
<rect x="20" y="200" width="380" height="60" rx="4" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
<rect x="20" y="200" width="6" height="60" fill="#4464f0"/>
<text x="40" y="222" class="code" style="font-weight:700">reasoning_trace</text>
<text x="40" y="239" class="lbl">string | list</text>
<text x="160" y="239" class="m">Agent 推理过程记录</text>
<path d="M 405 230 L 500 230" stroke="#5E6B82" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="510" y="205" width="190" height="50" rx="4" fill="#eef2ff" stroke="#4464f0" stroke-width="1"/>
<text x="605" y="227" text-anchor="middle" class="h" style="fill:#4464f0">Process</text>
<text x="605" y="245" text-anchor="middle" class="m">权重 0.3</text>
<rect x="20" y="270" width="380" height="60" rx="4" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
<rect x="20" y="270" width="6" height="60" fill="#4464f0"/>
<text x="40" y="292" class="code" style="font-weight:700">evidence</text>
<text x="40" y="309" class="lbl">list</text>
<text x="160" y="309" class="m">支撑根因结论的观测证据</text>
<path d="M 405 300 L 500 300" stroke="#5E6B82" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="510" y="275" width="190" height="50" rx="4" fill="#eef2ff" stroke="#4464f0" stroke-width="1" stroke-dasharray="3,2"/>
<text x="605" y="297" text-anchor="middle" class="h" style="fill:#4464f0">Process</text>
<text x="605" y="315" text-anchor="middle" class="m">与 reasoning_trace 合并</text>
<path d="M 605 255 L 605 275" stroke="#4464f0" stroke-width="1" stroke-dasharray="2,2"/>
<defs><marker id="ar" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#5E6B82"/></marker></defs>
<text x="20" y="390" class="cap">四字段缺一即视为无效提交 — 是 §5.2 三维独立打分的前置条件。归一化提取容忍 Agent 输出自然语言或 JSON。</text>
</svg>