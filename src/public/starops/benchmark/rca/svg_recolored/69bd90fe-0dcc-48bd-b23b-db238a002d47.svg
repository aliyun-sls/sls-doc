<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="920" viewBox="0 0 760 460">
<style>
  .ti{font:700 16px "PingFang SC","Helvetica Neue",sans-serif;fill:#1A2233}
  .h{font:700 13px "PingFang SC","Helvetica Neue",sans-serif;fill:#1A2233}
  .h2{font:700 12px "PingFang SC","Helvetica Neue",sans-serif;fill:#1A2233}
  .b{font:12px "PingFang SC","Helvetica Neue",sans-serif;fill:#1A2233}
  .m{font:11.5px "PingFang SC","Helvetica Neue",sans-serif;fill:#5E6B82}
  .lbl{font:11px "PingFang SC","Helvetica Neue",sans-serif;fill:#888}
  .big{font:700 20px "Helvetica Neue",sans-serif;fill:#4464f0}
  .code{font:10.5px Menlo,Consolas,monospace;fill:#1A2233}
  .cap{font:11px "PingFang SC","Helvetica Neue",sans-serif;fill:#888}
  .hdr{font:700 11.5px "PingFang SC","Helvetica Neue",sans-serif;fill:#FFFFFF}
</style>
<rect width="760" height="460" fill="#FFFFFF"/>
<text x="20" y="28" class="ti">RCA-Bench 整体架构：三类组件与评估生命周期</text>
<line x1="20" y1="38" x2="740" y2="38" stroke="#4464f0" stroke-width="2"/>
<rect x="20" y="55" width="720" height="34" rx="4" fill="#4464f0"/>
<text x="35" y="77" class="hdr">组件层</text>
<text x="200" y="77" class="hdr">职责</text>
<text x="540" y="77" class="hdr">所属章节</text>
<text x="660" y="77" class="hdr">第 4-5 章对应</text>
<rect x="20" y="89" width="720" height="76" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="0.8"/>
<text x="35" y="111" class="h" style="fill:#4464f0">运行环境层</text>
<text x="200" y="111" class="m">承载被测分布式系统、注入背景流量、暴露 Agent 可见的观测信号面</text>
<text x="540" y="129" class="m">§3.3 至 §3.6</text>
<text x="660" y="129" class="m">—</text>
<rect x="20" y="167" width="720" height="76" fill="#F8FAFC" stroke="#D1D5DB" stroke-width="0.8"/>
<text x="35" y="189" class="h" style="fill:#4464f0">数据集层</text>
<text x="200" y="189" class="m">把注入计划与运行环境产生的观测信号封装为可评估的结构化用例，</text>
<text x="200" y="205" class="m">含基线真值与质量门禁</text>
<text x="540" y="207" class="m">—</text>
<text x="660" y="207" class="m">第 4 章</text>
<rect x="20" y="245" width="720" height="76" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="0.8"/>
<text x="35" y="267" class="h" style="fill:#4464f0">评估协议层</text>
<text x="200" y="267" class="m">定义 Agent 任务输入、工具规范、输出契约与三维评分函数</text>
<text x="540" y="285" class="m">—</text>
<text x="660" y="285" class="m">第 5 章</text>
<rect x="20" y="331" width="720" height="62" rx="4" fill="#eef2ff" stroke="#4464f0" stroke-width="1.2"/>
<text x="35" y="353" class="h" style="fill:#4464f0">评估生命周期</text>
<text x="200" y="353" class="m">跨三层组件贯通的七阶段固定流水：</text>
<rect x="35" y="369" width="90" height="18" rx="3" fill="#FFFFFF" stroke="#4464f0" stroke-width="0.8"/>
<text x="80" y="381" text-anchor="middle" class="m">环境预检</text>
<rect x="135" y="369" width="90" height="18" rx="3" fill="#FFFFFF" stroke="#4464f0" stroke-width="0.8"/>
<text x="180" y="381" text-anchor="middle" class="m">故障注入</text>
<rect x="235" y="369" width="90" height="18" rx="3" fill="#FFFFFF" stroke="#4464f0" stroke-width="0.8"/>
<text x="280" y="381" text-anchor="middle" class="m">等待传播</text>
<rect x="335" y="369" width="90" height="18" rx="3" fill="#FFFFFF" stroke="#4464f0" stroke-width="0.8"/>
<text x="380" y="381" text-anchor="middle" class="m">采集与评估</text>
<rect x="435" y="369" width="90" height="18" rx="3" fill="#FFFFFF" stroke="#4464f0" stroke-width="0.8"/>
<text x="480" y="381" text-anchor="middle" class="m">环境恢复</text>
<rect x="535" y="369" width="90" height="18" rx="3" fill="#FFFFFF" stroke="#4464f0" stroke-width="0.8"/>
<text x="580" y="381" text-anchor="middle" class="m">稳态验证</text>
<rect x="635" y="369" width="90" height="18" rx="3" fill="#FFFFFF" stroke="#4464f0" stroke-width="0.8"/>
<text x="680" y="381" text-anchor="middle" class="m">并发禁止</text>
<text x="20" y="445" class="cap">三类组件按层次承载，生命周期七阶段跨层贯通；该结构是后续四项核心设计的承载骨架。</text>
</svg>