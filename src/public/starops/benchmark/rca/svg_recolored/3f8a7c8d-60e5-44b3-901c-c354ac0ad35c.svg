<svg width="1920" height="960" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480">
<style>
  .fig-title  { font: 700 17px "PingFang SC", "Helvetica Neue", Arial, sans-serif; fill: #1A2233; }
  .label      { font: 700 13px "PingFang SC", "Helvetica Neue", Arial, sans-serif; fill: #1A2233; }
  .body       { font: 12px "PingFang SC", "Helvetica Neue", Arial, sans-serif; fill: #1A2233; }
  .body-sm    { font: 11px "PingFang SC", "Helvetica Neue", Arial, sans-serif; fill: #5E6B82; }
  .tier       { font: 700 11px Menlo, Consolas, monospace; fill: #1A2233; }
  .mono-sm    { font: 11px Menlo, Consolas, monospace; fill: #1A2233; }
  .col-hdr    { font: 700 11px "PingFang SC", Arial, sans-serif; fill: #1A2233; }
  .fig-caption{ font: 11.5px "PingFang SC", "Helvetica Neue", Arial, sans-serif; fill: #5E6B82; }
  .annot      { font: italic 10.5px "PingFang SC", Arial, sans-serif; fill: #5E6B82; }
  .cell-title { font: 700 14px "PingFang SC", "Helvetica Neue", Arial, sans-serif; fill: #1A2233; }
  .cell-en    { font: 11px "Helvetica Neue", Arial, sans-serif; fill: #888; }
</style>
<defs>
  <marker id="arrInk" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><polygon points="0 0, 9 4.5, 0 9" fill="#1A2233"/></marker>
  <marker id="arrGray" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><polygon points="0 0, 9 4.5, 0 9" fill="#5E6B82"/></marker>
  <marker id="arrFail" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><polygon points="0 0, 9 4.5, 0 9" fill="#C03A28"/></marker>
</defs>
<rect width="960" height="480" fill="#fff"/>
<text x="40" y="32" class="fig-title">故障注入流水线：4 类注入源 × 3 阶段判定</text>
<line x1="40" y1="42" x2="920" y2="42" stroke="#1A2233" stroke-width="0.8"/>
<text x="60" y="68" class="label">注入源（4 类）</text>
<defs><clipPath id="cell-fig22-src-0"><rect x="60" y="80" width="220" height="60" rx="6"/></clipPath></defs><rect x="60" y="80" width="220" height="60" rx="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.2"/><rect x="60" y="80" width="220" height="6" fill="#4464f0" clip-path="url(#cell-fig22-src-0)"/>
<text x="75" y="106" class="label">ChaosBlade</text>
<text x="75" y="125" class="body-sm">应用 / 平台层</text>
<defs><clipPath id="cell-fig22-src-1"><rect x="60" y="156" width="220" height="60" rx="6"/></clipPath></defs><rect x="60" y="156" width="220" height="60" rx="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.2"/><rect x="60" y="156" width="220" height="6" fill="#4464f0" clip-path="url(#cell-fig22-src-1)"/>
<text x="75" y="182" class="label">Chaos Mesh</text>
<text x="75" y="201" class="body-sm">Kubernetes 资源层</text>
<defs><clipPath id="cell-fig22-src-2"><rect x="60" y="232" width="220" height="60" rx="6"/></clipPath></defs><rect x="60" y="232" width="220" height="60" rx="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.2"/><rect x="60" y="232" width="220" height="6" fill="#4464f0" clip-path="url(#cell-fig22-src-2)"/>
<text x="75" y="258" class="label">K8s 原生 + FF</text>
<text x="75" y="277" class="body-sm">配置 / Feature Flag</text>
<defs><clipPath id="cell-fig22-src-3"><rect x="60" y="308" width="220" height="60" rx="6"/></clipPath></defs><rect x="60" y="308" width="220" height="60" rx="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.2"/><rect x="60" y="308" width="220" height="6" fill="#4464f0" clip-path="url(#cell-fig22-src-3)"/>
<text x="75" y="334" class="label">云服务 API</text>
<text x="75" y="353" class="body-sm">云资源 / 中间件层</text>
<line x1="290" y1="240" x2="340" y2="240" stroke="#1A2233" stroke-width="1.4" marker-end="url(#arrInk)"/>
<text x="360" y="68" class="label">3 阶段判定（任一失败即弃用）</text>
<defs><clipPath id="cell-fig22-stage-0"><rect x="360" y="80" width="380" height="75" rx="6"/></clipPath></defs><rect x="360" y="80" width="380" height="75" rx="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.2"/><rect x="360" y="80" width="380" height="6" fill="#4464f0" clip-path="url(#cell-fig22-stage-0)"/>
<text x="375" y="106" class="label">① 注入成功</text>
<text x="375" y="128" class="body-sm">注入命令返回 success</text>
<line x1="550.0" y1="155" x2="550.0" y2="179" stroke="#3E8E5F" stroke-width="1.4" marker-end="url(#arrGray)"/>
<text x="558.0" y="170" class="annot" fill="#3E8E5F">通过</text>
<line x1="740" y1="117.5" x2="770" y2="117.5" stroke="#C03A28" stroke-width="1.2" stroke-dasharray="3,2" marker-end="url(#arrFail)"/>
<text x="775" y="121.5" class="annot" fill="#C03A28">弃用</text>
<defs><clipPath id="cell-fig22-stage-1"><rect x="360" y="180" width="380" height="75" rx="6"/></clipPath></defs><rect x="360" y="180" width="380" height="75" rx="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.2"/><rect x="360" y="180" width="380" height="6" fill="#4464f0" clip-path="url(#cell-fig22-stage-1)"/>
<text x="375" y="206" class="label">② 信号生效</text>
<text x="375" y="228" class="body-sm">注入窗口内目标指标按预期变化</text>
<line x1="550.0" y1="255" x2="550.0" y2="279" stroke="#3E8E5F" stroke-width="1.4" marker-end="url(#arrGray)"/>
<text x="558.0" y="270" class="annot" fill="#3E8E5F">通过</text>
<line x1="740" y1="217.5" x2="770" y2="217.5" stroke="#C03A28" stroke-width="1.2" stroke-dasharray="3,2" marker-end="url(#arrFail)"/>
<text x="775" y="221.5" class="annot" fill="#C03A28">弃用</text>
<defs><clipPath id="cell-fig22-stage-2"><rect x="360" y="280" width="380" height="75" rx="6"/></clipPath></defs><rect x="360" y="280" width="380" height="75" rx="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.2"/><rect x="360" y="280" width="380" height="6" fill="#4464f0" clip-path="url(#cell-fig22-stage-2)"/>
<text x="375" y="306" class="label">③ 因果链成立</text>
<text x="375" y="328" class="body-sm">观测到设计的传播链与影响范围</text>
<line x1="740" y1="317.5" x2="770" y2="317.5" stroke="#C03A28" stroke-width="1.2" stroke-dasharray="3,2" marker-end="url(#arrFail)"/>
<text x="775" y="321.5" class="annot" fill="#C03A28">弃用</text>
<line x1="550.0" y1="355" x2="550.0" y2="380" stroke="#3E8E5F" stroke-width="1.4" marker-end="url(#arrGray)"/>
<rect x="460.0" y="380" width="180" height="40" rx="6" fill="#ECFDF5" stroke="#3E8E5F" stroke-width="1.4"/>
<text x="550.0" y="405" text-anchor="middle" class="label" fill="#3E8E5F">入库到候选池</text>
<text x="40" y="440" class="fig-caption">4 类注入源覆盖应用层、平台层、配置层、云资源层四类故障域；每个注入候选必须通过 3 阶段判定才能进入候选池。</text>
<text x="40" y="460" class="fig-caption">注入命令成功 ≠ 样本有效。生产实践中信号未生效或因果链未成立的注入约占 30%，全部进入失败队列由人工分流。</text>
</svg>