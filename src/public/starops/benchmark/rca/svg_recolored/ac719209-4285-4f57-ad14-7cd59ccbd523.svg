<svg width="1920" height="1080" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540">
<style>
  .fig-title  { font: 700 17px "PingFang SC", "Helvetica Neue", Arial, sans-serif; fill: #1A2233; }
  .cell-title { font: 700 14px "PingFang SC", "Helvetica Neue", Arial, sans-serif; fill: #1A2233; }
  .cell-en    { font: 11px "Helvetica Neue", Arial, sans-serif; fill: #888; }
  .label      { font: 700 13px "PingFang SC", "Helvetica Neue", Arial, sans-serif; fill: #1A2233; }
  .body       { font: 12px "PingFang SC", "Helvetica Neue", Arial, sans-serif; fill: #1A2233; }
  .body-sm    { font: 11px "PingFang SC", "Helvetica Neue", Arial, sans-serif; fill: #5E6B82; }
  .tier       { font: 700 11px Menlo, Consolas, monospace; fill: #1A2233; }
  .fig-caption{ font: 11.5px "PingFang SC", "Helvetica Neue", Arial, sans-serif; fill: #5E6B82; }
  .annot      { font: italic 10.5px "PingFang SC", Arial, sans-serif; fill: #5E6B82; }
  .summary-big{ font: 700 28px "Helvetica Neue", Arial, sans-serif; fill: #4464f0; }
  .summary-lbl{ font: 11px "PingFang SC", "Helvetica Neue", Arial, sans-serif; fill: #5E6B82; }
</style>
<defs>
  <marker id="arrInk" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><polygon points="0 0, 9 4.5, 0 9" fill="#1A2233"/></marker>
  <marker id="arrGray" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><polygon points="0 0, 9 4.5, 0 9" fill="#5E6B82"/></marker>
  <marker id="arrPass" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><polygon points="0 0, 9 4.5, 0 9" fill="#3E8E5F"/></marker>
  <marker id="arrWarn" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><polygon points="0 0, 9 4.5, 0 9" fill="#C76A1F"/></marker>
</defs>
<rect width="960" height="540" fill="#fff"/>
<text x="40" y="32" class="fig-title">多智能体审核（N=3 跨厂商共识 + SRE 兜底）</text>
<line x1="40" y1="42" x2="920" y2="42" stroke="#1A2233" stroke-width="0.8"/>
<text x="60" y="85" class="summary-big" style="fill:#4464f0">3</text>
<text x="60" y="103" class="summary-lbl">独立 LLM 评审</text>
<text x="220" y="85" class="summary-big" style="fill:#4464f0">≥ 2/3</text>
<text x="220" y="103" class="summary-lbl">共识投票阈值</text>
<text x="420" y="85" class="summary-big" style="fill:#3E8E5F">~93%</text>
<text x="420" y="103" class="summary-lbl">自动入库率</text>
<text x="620" y="85" class="summary-big" style="fill:#C76A1F">~7%</text>
<text x="620" y="103" class="summary-lbl">转 SRE 复核</text>
<line x1="40" y1="120" x2="920" y2="120" stroke="#D1D5DB" stroke-width="0.5"/>
<rect x="50" y="230" width="130" height="70" rx="6" fill="#F8FAFC" stroke="#D1D5DB" stroke-width="1"/>
<text x="115.0" y="260" text-anchor="middle" class="label">候选用例</text>
<text x="115.0" y="280" text-anchor="middle" class="body-sm">通过 GSTO 后</text>
