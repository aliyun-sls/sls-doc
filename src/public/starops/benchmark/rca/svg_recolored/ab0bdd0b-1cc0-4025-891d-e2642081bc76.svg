<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="720" viewBox="0 0 760 360">
<style>
  .ti{font:700 16px "PingFang SC","Helvetica Neue",sans-serif;fill:#1A2233}
  .h{font:700 13px "PingFang SC","Helvetica Neue",sans-serif;fill:#1A2233}
  .h2{font:700 12px "PingFang SC","Helvetica Neue",sans-serif;fill:#1A2233}
  .b{font:12px "PingFang SC","Helvetica Neue",sans-serif;fill:#1A2233}
  .m{font:11.5px "PingFang SC","Helvetica Neue",sans-serif;fill:#5E6B82}
  .lbl{font:11px "PingFang SC","Helvetica Neue",sans-serif;fill:#888}
  .big{font:700 20px "Helvetica Neue",sans-serif;fill:#4464f0}
  .code{font:10.5px Menlo,Consolas,monospace;fill:#1A2233}
  .cap{font:11px "PingFang SC","Helvetica Neue",sans-serif;fill:#888}
  .hdr{font:700 11.5px "PingFang SC","Helvetica Neue",sans-serif;fill:#FFFFFF}
</style>
<rect width="760" height="360" fill="#FFFFFF"/>
<text x="20" y="28" class="ti">RCA-100 v1 单用例 UModel 实体与边数分布 (n=103)</text>
<line x1="20" y1="38" x2="740" y2="38" stroke="#4464f0" stroke-width="2"/>
<text x="20" y="80" class="h">实体数 / 用例</text>
<line x1="100" y1="130" x2="600" y2="130" stroke="#1A2233" stroke-width="1"/>
<line x1="100.0" y1="128" x2="100.0" y2="132" stroke="#1A2233" stroke-width="0.8"/>
<text x="100.0" y="148" text-anchor="middle" class="lbl">0</text>
<line x1="225.0" y1="128" x2="225.0" y2="132" stroke="#1A2233" stroke-width="0.8"/>
<text x="225.0" y="148" text-anchor="middle" class="lbl">100</text>
<line x1="350.0" y1="128" x2="350.0" y2="132" stroke="#1A2233" stroke-width="0.8"/>
<text x="350.0" y="148" text-anchor="middle" class="lbl">200</text>
<line x1="475.0" y1="128" x2="475.0" y2="132" stroke="#1A2233" stroke-width="0.8"/>
<text x="475.0" y="148" text-anchor="middle" class="lbl">300</text>
<line x1="600.0" y1="128" x2="600.0" y2="132" stroke="#1A2233" stroke-width="0.8"/>
<text x="600.0" y="148" text-anchor="middle" class="lbl">400</text>
<rect x="342.5" y="100" width="120.0" height="22" rx="3" fill="#eef2ff" stroke="#4464f0"/>
<line x1="383.75" y1="98" x2="383.75" y2="124" stroke="#4464f0" stroke-width="2.5"/>
<text x="383.75" y="92" text-anchor="middle" class="h2" style="fill:#4464f0">median 227</text>
<text x="338.5" y="114" text-anchor="end" class="lbl">min 194</text>
<text x="466.5" y="114" class="lbl">p95 290</text>
<text x="610" y="114" class="m" style="fill:#4464f0">max 2083 ←</text>
<text x="20" y="200" class="h">边数 / 用例</text>
<line x1="100" y1="250" x2="600" y2="250" stroke="#1A2233" stroke-width="1"/>
<line x1="100.0" y1="248" x2="100.0" y2="252" stroke="#1A2233" stroke-width="0.8"/>
<text x="100.0" y="268" text-anchor="middle" class="lbl">0</text>
<line x1="225.0" y1="248" x2="225.0" y2="252" stroke="#1A2233" stroke-width="0.8"/>
<text x="225.0" y="268" text-anchor="middle" class="lbl">100</text>
<line x1="350.0" y1="248" x2="350.0" y2="252" stroke="#1A2233" stroke-width="0.8"/>
<text x="350.0" y="268" text-anchor="middle" class="lbl">200</text>
<line x1="475.0" y1="248" x2="475.0" y2="252" stroke="#1A2233" stroke-width="0.8"/>
<text x="475.0" y="268" text-anchor="middle" class="lbl">300</text>
<line x1="600.0" y1="248" x2="600.0" y2="252" stroke="#1A2233" stroke-width="0.8"/>
<text x="600.0" y="268" text-anchor="middle" class="lbl">400</text>
<rect x="260.0" y="220" width="275.0" height="22" rx="3" fill="#eef2ff" stroke="#4464f0"/>
<line x1="422.5" y1="218" x2="422.5" y2="244" stroke="#4464f0" stroke-width="2.5"/>
<text x="422.5" y="212" text-anchor="middle" class="h2" style="fill:#4464f0">median 258</text>
<text x="256.0" y="234" text-anchor="end" class="lbl">min 128</text>
<text x="539.0" y="234" class="lbl">p95 348</text>
<text x="610" y="234" class="m" style="fill:#4464f0">max 2080 ←</text>
<text x="20" y="330" class="cap">实体数中位 227，边数中位 258；max 处出现量级跳跃的用例</text>
<text x="20" y="345" class="cap">是较大微服务规模的真实拓扑。横轴对长尾截断显示，max 单独标注。</text>
</svg>