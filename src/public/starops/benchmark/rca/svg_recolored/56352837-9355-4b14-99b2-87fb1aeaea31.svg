<svg width="1920" height="1040" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520">
<style>
  .fig-title  { font: 700 17px "PingFang SC", "Helvetica Neue", Arial, sans-serif; fill: #1A2233; }
  .cell-title { font: 700 14px "PingFang SC", "Helvetica Neue", Arial, sans-serif; fill: #1A2233; }
  .cell-en    { font: 11px "Helvetica Neue", Arial, sans-serif; fill: #888; }
  .label      { font: 700 13px "PingFang SC", "Helvetica Neue", Arial, sans-serif; fill: #1A2233; }
  .body       { font: 12px "PingFang SC", "Helvetica Neue", Arial, sans-serif; fill: #1A2233; }
  .body-sm    { font: 11px "PingFang SC", "Helvetica Neue", Arial, sans-serif; fill: #5E6B82; }
  .tier       { font: 700 11px Menlo, Consolas, monospace; fill: #1A2233; }
  .mono-sm    { font: 11px Menlo, Consolas, monospace; fill: #1A2233; }
  .formula    { font: 12px Menlo, Consolas, monospace; fill: #1A2233; }
  .fig-caption{ font: 11.5px "PingFang SC", "Helvetica Neue", Arial, sans-serif; fill: #5E6B82; }
  .annot      { font: italic 10.5px "PingFang SC", Arial, sans-serif; fill: #5E6B82; }
  .col-hdr    { font: 700 11px "PingFang SC", Arial, sans-serif; fill: #1A2233; }
  .row-hdr    { font: 11px "PingFang SC", Arial, sans-serif; fill: #1A2233; }
</style>
<defs>
  <marker id="arrInk" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><polygon points="0 0, 9 4.5, 0 9" fill="#1A2233"/></marker>
  <marker id="arrGray" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><polygon points="0 0, 9 4.5, 0 9" fill="#5E6B82"/></marker>
  <marker id="arrBlue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><polygon points="0 0, 9 4.5, 0 9" fill="#4464f0"/></marker>
</defs>
<rect width="960" height="520" fill="#fff"/>
<text x="40" y="32" class="fig-title">UModel 实体归一化 5 步流水线</text>
<line x1="40" y1="42" x2="920" y2="42" stroke="#1A2233" stroke-width="0.8"/>
<rect x="40" y="80" width="180" height="60" rx="6" fill="#F8FAFC" stroke="#D1D5DB" stroke-width="1.2"/>
<text x="130" y="105" text-anchor="middle" class="label">Agent 输出实体名</text>
<text x="130" y="125" text-anchor="middle" class="mono-sm" fill="#5E6B82">"inventory pod"</text>
<defs><clipPath id="cell-fig18-0"><rect x="280" y="80" width="540" height="60" rx="6"/></clipPath></defs><rect x="280" y="80" width="540" height="60" rx="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.2"/><rect x="280" y="80" width="540" height="6" fill="#4464f0" clip-path="url(#cell-fig18-0)"/>
<circle cx="302" cy="113" r="14" fill="#4464f0"/>
<text x="302" y="118" text-anchor="middle" font-size="13" font-weight="700" style="fill:#fff">1</text>
<text x="324" y="105" class="label">精确 token 匹配</text>
<text x="324" y="122" class="mono-sm" fill="#5E6B82">exact_match(input, entity_id)</text>
<text x="805" y="118" text-anchor="end" class="annot">直接命中即返回</text>
<defs><clipPath id="cell-fig18-1"><rect x="280" y="152" width="540" height="60" rx="6"/></clipPath></defs><rect x="280" y="152" width="540" height="60" rx="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.2"/><rect x="280" y="152" width="540" height="6" fill="#4464f0" clip-path="url(#cell-fig18-1)"/>
<circle cx="302" cy="185" r="14" fill="#4464f0"/>
<text x="302" y="190" text-anchor="middle" font-size="13" font-weight="700" style="fill:#fff">2</text>
<text x="324" y="177" class="label">规则归一化</text>
<text x="324" y="194" class="mono-sm" fill="#5E6B82">normalize(input) → token</text>
<text x="805" y="190" text-anchor="end" class="annot">pod-id → deployment</text>
<defs><clipPath id="cell-fig18-2"><rect x="280" y="224" width="540" height="60" rx="6"/></clipPath></defs><rect x="280" y="224" width="540" height="60" rx="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.2"/><rect x="280" y="224" width="540" height="6" fill="#4464f0" clip-path="url(#cell-fig18-2)"/>
<circle cx="302" cy="257" r="14" fill="#4464f0"/>
<text x="302" y="262" text-anchor="middle" font-size="13" font-weight="700" style="fill:#fff">3</text>
<text x="324" y="249" class="label">别名映射</text>
<text x="324" y="266" class="mono-sm" fill="#5E6B82">alias_lookup(token)</text>
<text x="805" y="262" text-anchor="end" class="annot">k8s.deployment ↔ apm.service</text>
<defs><clipPath id="cell-fig18-3"><rect x="280" y="296" width="540" height="60" rx="6"/></clipPath></defs><rect x="280" y="296" width="540" height="60" rx="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.2"/><rect x="280" y="296" width="540" height="6" fill="#4464f0" clip-path="url(#cell-fig18-3)"/>
<circle cx="302" cy="329" r="14" fill="#4464f0"/>
<text x="302" y="334" text-anchor="middle" font-size="13" font-weight="700" style="fill:#fff">4</text>
<text x="324" y="321" class="label">UModel 主键查找</text>
<text x="324" y="338" class="mono-sm" fill="#5E6B82">pk_lookup(token)</text>
<text x="805" y="334" text-anchor="end" class="annot">查 6 域统一主键表</text>
<defs><clipPath id="cell-fig18-4"><rect x="280" y="368" width="540" height="60" rx="6"/></clipPath></defs><rect x="280" y="368" width="540" height="60" rx="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.2"/><rect x="280" y="368" width="540" height="6" fill="#4464f0" clip-path="url(#cell-fig18-4)"/>
<circle cx="302" cy="401" r="14" fill="#4464f0"/>
<text x="302" y="406" text-anchor="middle" font-size="13" font-weight="700" style="fill:#fff">5</text>
<text x="324" y="393" class="label">拓扑 BFS 距离</text>
<text x="324" y="410" class="mono-sm" fill="#5E6B82">topo_bfs(token, gt_entity)</text>
<text x="805" y="406" text-anchor="end" class="annot">邻接距离作 boundary 评分输入</text>
<line x1="550.0" y1="140" x2="550.0" y2="151" stroke="#5E6B82" stroke-width="1.2" marker-end="url(#arrGray)"/>
<text x="560.0" y="149" class="annot">未命中</text>
<line x1="550.0" y1="212" x2="550.0" y2="223" stroke="#5E6B82" stroke-width="1.2" marker-end="url(#arrGray)"/>
<text x="560.0" y="221" class="annot">未命中</text>
<line x1="550.0" y1="284" x2="550.0" y2="295" stroke="#5E6B82" stroke-width="1.2" marker-end="url(#arrGray)"/>
<text x="560.0" y="293" class="annot">未命中</text>
<line x1="550.0" y1="356" x2="550.0" y2="367" stroke="#5E6B82" stroke-width="1.2" marker-end="url(#arrGray)"/>
<text x="560.0" y="365" class="annot">未命中</text>
<line x1="220" y1="110" x2="278" y2="110" stroke="#1A2233" stroke-width="1.4" marker-end="url(#arrInk)"/>
<text x="40" y="495" class="fig-caption">五步按确定性顺序执行；每一步命中即返回，未命中下落到下一步。每步均记录到评估 trace，便于审计与复现。</text>
<text x="40" y="510" class="fig-caption">最终输出 = 标准主键（用于 boundary 评分）+ 归一化路径（用于诊断 trace）。</text>
</svg>