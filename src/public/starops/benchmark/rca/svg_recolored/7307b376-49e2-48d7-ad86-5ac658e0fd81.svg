<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="1080" viewBox="0 0 760 540">
<style>
  .ti{font:700 16px "PingFang SC","Helvetica Neue",sans-serif;fill:#1A2233}
  .h{font:700 13px "PingFang SC","Helvetica Neue",sans-serif;fill:#1A2233}
  .h2{font:700 12px "PingFang SC","Helvetica Neue",sans-serif;fill:#1A2233}
  .b{font:12px "PingFang SC","Helvetica Neue",sans-serif;fill:#1A2233}
  .m{font:11.5px "PingFang SC","Helvetica Neue",sans-serif;fill:#5E6B82}
  .lbl{font:11px "PingFang SC","Helvetica Neue",sans-serif;fill:#888}
  .big{font:700 20px "Helvetica Neue",sans-serif;fill:#4464f0}
  .code{font:10.5px Menlo,Consolas,monospace;fill:#1A2233}
  .cap{font:11px "PingFang SC","Helvetica Neue",sans-serif;fill:#888}
  .hdr{font:700 11.5px "PingFang SC","Helvetica Neue",sans-serif;fill:#FFFFFF}
</style>
<rect width="760" height="540" fill="#FFFFFF"/>
<text x="20" y="28" class="ti">Boundary Score：七个匹配等级</text>
<line x1="20" y1="38" x2="740" y2="38" stroke="#4464f0" stroke-width="2"/>
<rect x="20" y="55" width="720" height="56" rx="4" fill="#FFFFFF" stroke="#D1D5DB"/>
<rect x="20" y="55" width="6" height="56" fill="#3E8E5F"/>
<text x="40" y="77" class="code" style="font-weight:700;fill:#3E8E5F">EXACT_ENTITY</text>
<rect x="240" y="67" width="264" height="14" rx="3" fill="#3E8E5F" opacity="0.85"/>
<text x="512" y="79" class="h" style="fill:#3E8E5F">1.00</text>
<text x="40" y="97" class="m">命中同一 entity_id</text>
<text x="735" y="97" text-anchor="end" class="lbl">主键精确匹配</text>
<rect x="20" y="119" width="720" height="56" rx="4" fill="#F8FAFC" stroke="#D1D5DB"/>
<rect x="20" y="119" width="6" height="56" fill="#3E8E5F"/>
<text x="40" y="141" class="code" style="font-weight:700;fill:#3E8E5F">SAME_RUNTIME_GROUP</text>
<rect x="240" y="131" width="212" height="14" rx="3" fill="#3E8E5F" opacity="0.85"/>
<text x="460" y="143" class="h" style="fill:#3E8E5F">0.80</text>
<text x="40" y="161" class="m">同一运行时组（如同 deployment 下的不同 Pod）</text>
<text x="735" y="161" text-anchor="end" class="lbl">实体不同但运行时等价</text>
<rect x="20" y="183" width="720" height="56" rx="4" fill="#FFFFFF" stroke="#D1D5DB"/>
<rect x="20" y="183" width="6" height="56" fill="#4464f0"/>
<text x="40" y="205" class="code" style="font-weight:700;fill:#4464f0">SAME_HOST_NODE</text>
<rect x="240" y="195" width="173" height="14" rx="3" fill="#4464f0" opacity="0.85"/>
<text x="421" y="207" class="h" style="fill:#4464f0">0.65</text>
<text x="40" y="225" class="m">同一宿主节点</text>
<text x="735" y="225" text-anchor="end" class="lbl">跨域但物理位置一致</text>
<rect x="20" y="247" width="720" height="56" rx="4" fill="#F8FAFC" stroke="#D1D5DB"/>
<rect x="20" y="247" width="6" height="56" fill="#4464f0"/>
<text x="40" y="269" class="code" style="font-weight:700;fill:#4464f0">TOPO_1HOP</text>
<rect x="240" y="259" width="121" height="14" rx="3" fill="#4464f0" opacity="0.85"/>
<text x="369" y="271" class="h" style="fill:#4464f0">0.45</text>
<text x="40" y="289" class="m">拓扑一跳邻居</text>
<text x="735" y="289" text-anchor="end" class="lbl">直接依赖或直接被依赖</text>
<rect x="20" y="311" width="720" height="56" rx="4" fill="#FFFFFF" stroke="#D1D5DB"/>
<rect x="20" y="311" width="6" height="56" fill="#C76A1F"/>
<text x="40" y="333" class="code" style="font-weight:700;fill:#C76A1F">TOPO_2HOP</text>
<rect x="240" y="323" width="82" height="14" rx="3" fill="#C76A1F" opacity="0.85"/>
<text x="330" y="335" class="h" style="fill:#C76A1F">0.30</text>
<text x="40" y="353" class="m">拓扑两跳邻居</text>
<text x="735" y="353" text-anchor="end" class="lbl">间接传播路径</text>
<rect x="20" y="375" width="720" height="56" rx="4" fill="#F8FAFC" stroke="#D1D5DB"/>
<rect x="20" y="375" width="6" height="56" fill="#C76A1F"/>
<text x="40" y="397" class="code" style="font-weight:700;fill:#C76A1F">TOPO_3HOP</text>
<rect x="240" y="387" width="56" height="14" rx="3" fill="#C76A1F" opacity="0.85"/>
<text x="304" y="399" class="h" style="fill:#C76A1F">0.20</text>
<text x="40" y="417" class="m">拓扑三跳邻居</text>
<text x="735" y="417" text-anchor="end" class="lbl">远端关联</text>
<rect x="20" y="439" width="720" height="56" rx="4" fill="#FFFFFF" stroke="#D1D5DB"/>
<rect x="20" y="439" width="6" height="56" fill="#C03A28"/>
<text x="40" y="461" class="code" style="font-weight:700;fill:#C03A28">NONE</text>
<rect x="240" y="451" width="4" height="14" rx="3" fill="#C03A28" opacity="0.85"/>
<text x="252" y="463" class="h" style="fill:#C03A28">0.00</text>
<text x="40" y="481" class="m">拓扑不可达或完全无关</text>
<text x="735" y="481" text-anchor="end" class="lbl">定位完全错误</text>
<text x="20" y="525" class="cap">七级覆盖从 entity 精确命中到完全无关；运行时组与宿主节点两档体现跨域语义等价；TOPO 1-3HOP 反映拓扑距离衰减。</text>
</svg>