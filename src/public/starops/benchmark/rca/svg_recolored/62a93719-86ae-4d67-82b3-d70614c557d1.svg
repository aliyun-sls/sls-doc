<line x1="40" y1="488" x2="920" y2="488" stroke="#D1D5DB" stroke-width="0.5"/>
<text x="40" y="513" class="fig-caption">前 4 角色（浏览 / 购物 / 售后 / 社区）对应电商主链 85% 流量；4S 店与金融为跨行业扩展，引入串行链路与批处理窗口。</text>
<text x="40" y="531" class="fig-caption">配置标识对应 Locust UserClass 名，详见 §3.5.1 双层调制策略与图 3-3 一周流量节律。</text>
