<svg width="1920" height="1080" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540">
<style>
  .fig-title  { font: 700 17px "PingFang SC", "Helvetica Neue", Arial, sans-serif; fill: #1A2233; }
  .col-hdr    { font: 700 12px "PingFang SC", Arial, sans-serif; fill: #1A2233; }
  .role-name  { font: 700 13px "PingFang SC", Arial, sans-serif; fill: #1A2233; }
  .role-id    { font: 11px Menlo, Consolas, monospace; fill: #5E6B82; }
  .body-sm    { font: 11px "PingFang SC", Arial, sans-serif; fill: #1A2233; }
  .pct        { font: 700 14px Menlo, Consolas, monospace; fill: #4464f0; }
  .annot      { font: italic 10.5px "PingFang SC", Arial, sans-serif; fill: #5E6B82; }
  .fig-caption{ font: 11.5px "PingFang SC", Arial, sans-serif; fill: #5E6B82; }
  .summary-big{ font: 700 28px "Helvetica Neue", Arial, sans-serif; fill: #4464f0; }
  .summary-lbl{ font: 11px "PingFang SC", Arial, sans-serif; fill: #5E6B82; }
</style>
<rect width="960" height="540" fill="#fff"/>
