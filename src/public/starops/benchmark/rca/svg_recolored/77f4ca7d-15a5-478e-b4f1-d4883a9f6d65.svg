<path d="M 838,200 L 838,240 Q 838,260 818,260 L 142,260 Q 122,260 122,240 L 122,200" fill="none" stroke="#888" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrGray)"/>
<rect x="430" y="250" width="100" height="18" fill="#fff"/>
<text x="480" y="262" text-anchor="middle" class="annot">下一用例循环</text>
<text x="40" y="296" class="label">关键约束</text>
<text x="40" y="314" class="body-sm">1. 自动记录实际受影响实体（非注入计划目标）</text>
<text x="40" y="329" class="body-sm">2. 恢复须通过稳态基线后方可启动下一 run</text>
<text x="450" y="314" class="body-sm">3. 幂等保护：禁止并发执行同一注入计划</text>
