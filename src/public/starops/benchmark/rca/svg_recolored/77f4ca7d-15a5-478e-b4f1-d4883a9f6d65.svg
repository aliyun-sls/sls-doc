<text x="694.5" y="152" text-anchor="middle" class="label">环境恢复</text>
<text x="694.5" y="172" text-anchor="middle" class="cell-en">Recovery</text>
<line x1="757" y1="145" x2="774" y2="145" stroke="#5E6B82" stroke-width="1.2" marker-end="url(#arrGray)"/>
<defs><clipPath id="cell-fig2-5"><rect x="775" y="90" width="125" height="110" rx="6"/></clipPath></defs>
