<svg width="1920" height="740" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 370">
<style>
  .fig-title  { font: 700 17px "PingFang SC", "Helvetica Neue", Arial, sans-serif; fill: #1A2233; }
