<text x="710" y="115" text-anchor="middle" class="mono-sm">fault_id: F010-slowSQL</text>
<text x="710" y="131" text-anchor="middle" class="mono-sm">entity_id: inventory-svc</text>
<text x="710" y="147" text-anchor="middle" class="mono-sm">causal_chain: [P0→P1→P2]</text>
<text x="710" y="163" text-anchor="middle" class="mono-sm">evidence_hits: [P0, P1]</text>
<line x1="710" y1="175" x2="710" y2="195" stroke="#1A2233" stroke-width="1.2"/>
<line x1="710" y1="195" x2="480" y2="195" stroke="#1A2233" stroke-width="1.2"/>
<line x1="480" y1="195" x2="480" y2="215" stroke="#1A2233" stroke-width="1.4" marker-end="url(#arrInk)"/>
<rect x="60" y="220" width="580" height="180" rx="8" fill="#ECFDF5" stroke="#3E8E5F" stroke-width="1.2" stroke-dasharray="6,3" opacity="0.55"/>
