<svg width="1920" height="1080" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540">
<style>
  .fig-title  { font: 700 17px "PingFang SC", "Helvetica Neue", Arial, sans-serif; fill: #1A2233; }
  .cell-title { font: 700 14px "PingFang SC", "Helvetica Neue", Arial, sans-serif; fill: #1A2233; }
  .cell-en    { font: 11px "Helvetica Neue", Arial, sans-serif; fill: #888; }
  .label      { font: 700 13px "PingFang SC", "Helvetica Neue", Arial, sans-serif; fill: #1A2233; }
  .body       { font: 12px "PingFang SC", "Helvetica Neue", Arial, sans-serif; fill: #1A2233; }
  .body-sm    { font: 11px "PingFang SC", "Helvetica Neue", Arial, sans-serif; fill: #5E6B82; }
  .tier       { font: 700 11px Menlo, Consolas, monospace; fill: #1A2233; }
  .formula    { font: 12px Menlo, Consolas, monospace; fill: #1A2233; }
  .mono-sm    { font: 11px Menlo, Consolas, monospace; fill: #1A2233; }
  .fig-caption{ font: 11.5px "PingFang SC", "Helvetica Neue", Arial, sans-serif; fill: #5E6B82; }
  .annot      { font: italic 10.5px "PingFang SC", Arial, sans-serif; fill: #5E6B82; }
  .layer-tag  { font: 700 11px "Helvetica Neue", Arial, sans-serif; fill: #888; }
</style>
<defs>
  <marker id="arrInk" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
    <polygon points="0 0, 9 4.5, 0 9" fill="#1A2233"/>
  </marker>
  <marker id="arrGray" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
    <polygon points="0 0, 9 4.5, 0 9" fill="#5E6B82"/>
  </marker>
  <marker id="arrFail" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
    <polygon points="0 0, 9 4.5, 0 9" fill="#C03A28"/>
  </marker>
  <marker id="arrPass" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
    <polygon points="0 0, 9 4.5, 0 9" fill="#3E8E5F"/>
  </marker>
</defs>
<rect width="960" height="540" fill="#fff"/>
<text x="40" y="32" class="fig-title">评估管线：结构化匹配优先，LLM 评判兜底</text>
<line x1="40" y1="42" x2="920" y2="42" stroke="#1A2233" stroke-width="0.6"/>
<rect x="60" y="70" width="200" height="105" rx="6" fill="#F8FAFC" stroke="#D1D5DB" stroke-width="1.2"/>
<text x="160" y="93" text-anchor="middle" class="label">Agent 输出</text>
<text x="160" y="115" text-anchor="middle" class="body-sm">自然语言报告</text>
<text x="160" y="131" text-anchor="middle" class="body-sm">或结构化 JSON</text>
<text x="160" y="155" text-anchor="middle" class="annot">"根因是 inventory 的慢查询…"</text>
<line x1="260" y1="122" x2="310" y2="122" stroke="#1A2233" stroke-width="1.4" marker-end="url(#arrInk)"/>
<defs><clipPath id="cell-fig14-norm"><rect x="320" y="70" width="220" height="105" rx="6"/></clipPath></defs><rect x="320" y="70" width="220" height="105" rx="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.2"/><rect x="320" y="70" width="220" height="6" fill="#4464f0" clip-path="url(#cell-fig14-norm)"/>
<text x="430" y="93" text-anchor="middle" class="label">归一化提取</text>
<text x="430" y="115" text-anchor="middle" class="body-sm">规则提取（正则 / 关键词 / 模板）</text>
<text x="430" y="131" text-anchor="middle" class="body-sm">+ LLM 辅助提取（兜底）</text>
<line x1="340" y1="142" x2="520" y2="142" stroke="#D1D5DB" stroke-width="0.6"/>
<text x="430" y="160" text-anchor="middle" class="body-sm">一致性校验 → 低置信度进入复核</text>
<line x1="540" y1="122" x2="590" y2="122" stroke="#1A2233" stroke-width="1.4" marker-end="url(#arrInk)"/>
<rect x="600" y="70" width="220" height="105" rx="6" fill="#FFFFFF" stroke="#1A2233" stroke-width="1.2"/>
