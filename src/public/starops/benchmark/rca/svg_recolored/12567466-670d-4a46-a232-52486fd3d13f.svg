<text x="210" y="282" text-anchor="middle" class="label">定因评分 Cause Score</text>
<text x="210" y="302" text-anchor="middle" class="body-sm">故障类型拓扑上的图距离匹配</text>
<defs><clipPath id="cell-fig14-boundary"><rect x="365" y="260" width="250" height="55" rx="6"/></clipPath></defs><rect x="365" y="260" width="250" height="55" rx="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.2"/><rect x="365" y="260" width="250" height="6" fill="#4464f0" clip-path="url(#cell-fig14-boundary)"/>
<text x="490" y="282" text-anchor="middle" class="label">定界评分 Boundary Score</text>
<text x="490" y="302" text-anchor="middle" class="body-sm">实体传播拓扑上的 BFS 距离</text>
<defs><clipPath id="cell-fig14-cov"><rect x="85" y="335" width="250" height="50" rx="6"/></clipPath></defs><rect x="85" y="335" width="250" height="50" rx="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.2"/><rect x="85" y="335" width="250" height="6" fill="#4464f0" clip-path="url(#cell-fig14-cov)"/>
<text x="210" y="357" text-anchor="middle" class="label">过程 · Coverage</text>
<text x="210" y="373" text-anchor="middle" class="body-sm">检查点命中率规则计算</text>
<rect x="660" y="220" width="260" height="180" rx="8" fill="#eef2ff" stroke="#C76A1F" stroke-width="1.2" stroke-dasharray="6,3" opacity="0.55"/>
<text x="675" y="240" class="label" fill="#C76A1F">LLM Judge 辅助</text>
<rect x="835" y="230" width="80" height="20" rx="10" fill="#C76A1F"/>
<text x="875" y="244" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">需 LLM</text>
<defs><clipPath id="cell-fig14-dir"><rect x="685" y="260" width="210" height="55" rx="6"/></clipPath></defs><rect x="685" y="260" width="210" height="55" rx="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.2"/><rect x="685" y="260" width="210" height="6" fill="#4464f0" clip-path="url(#cell-fig14-dir)"/>
<text x="790" y="282" text-anchor="middle" class="label">过程 · Directionality</text>
<text x="790" y="302" text-anchor="middle" class="body-sm">因果推理方向判断</text>
<defs><clipPath id="cell-fig14-grd"><rect x="685" y="335" width="210" height="50" rx="6"/></clipPath></defs><rect x="685" y="335" width="210" height="50" rx="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.2"/><rect x="685" y="335" width="210" height="6" fill="#4464f0" clip-path="url(#cell-fig14-grd)"/>
<text x="790" y="357" text-anchor="middle" class="label">过程 · Grounding</text>
<text x="790" y="373" text-anchor="middle" class="body-sm">证据支撑度语义判断</text>
<line x1="210" y1="315" x2="210" y2="425" stroke="#3E8E5F" stroke-width="1.4"/>
<line x1="490" y1="315" x2="490" y2="425" stroke="#3E8E5F" stroke-width="1.4"/>
<line x1="210" y1="385" x2="210" y2="425" stroke="#3E8E5F" stroke-width="1.4"/>
<line x1="790" y1="315" x2="790" y2="425" stroke="#C76A1F" stroke-width="1.4"/>
<line x1="790" y1="385" x2="790" y2="425" stroke="#C76A1F" stroke-width="1.4"/>
<text x="210" y="420" text-anchor="middle" class="tier" fill="#3E8E5F">0.3</text>
<text x="490" y="420" text-anchor="middle" class="tier" fill="#3E8E5F">0.4</text>
<text x="680" y="420" text-anchor="middle" class="tier" fill="#C76A1F">0.3（部分）</text>
<line x1="210" y1="425" x2="790" y2="425" stroke="#1A2233" stroke-width="1.2"/>
<line x1="480" y1="425" x2="480" y2="450" stroke="#1A2233" stroke-width="1.4" marker-end="url(#arrInk)"/>
<rect x="230" y="455" width="500" height="40" rx="6" fill="#F8FAFC" stroke="#1A2233" stroke-width="1.2"/>
<text x="480" y="480" text-anchor="middle" class="formula">MainScore = 0.4 · Boundary + 0.3 · Cause + 0.3 · Process</text>
<text x="40" y="515" class="fig-caption">绿色区域：约 70% 评分权重由确定性规则覆盖，结果完全可复现。橙色区域：约 30% 权重中的部分</text>
<text x="40" y="532" class="fig-caption">子维度依赖 LLM 评判，是当前需要持续优化的方向。归一化提取是整条管线的质量瓶颈。</text>
</svg>