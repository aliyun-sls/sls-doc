<svg width="2400" height="1080" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540">
<style>
  .fig-title  { font: 700 17px "PingFang SC", "Helvetica Neue", Arial, sans-serif; fill: #1A2233; }
