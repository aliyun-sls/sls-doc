<text x="580" y="112.0" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">1</text>
<text x="602" y="112.0" class="body" fill="#1A2233">精确 token 匹配</text>
<line x1="730.0" y1="126" x2="730.0" y2="134" stroke="#5E6B82" stroke-width="1.2" marker-end="url(#arrGray)"/>
<rect x="560" y="134" width="340" height="36" rx="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.2"/>
<circle cx="580" cy="152.0" r="11" fill="#4464f0"/>
