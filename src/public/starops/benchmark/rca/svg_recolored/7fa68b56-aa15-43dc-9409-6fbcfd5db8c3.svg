<svg width="1920" height="1080" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540">
<style>
  .fig-title  { font: 700 17px "PingFang SC", "Helvetica Neue", Arial, sans-serif; fill: #1A2233; }
  .cell-title { font: 700 14px "PingFang SC", "Helvetica Neue", Arial, sans-serif; fill: #1A2233; }
  .cell-en    { font: 11px "Helvetica Neue", Arial, sans-serif; fill: #888; }
  .label      { font: 700 13px "PingFang SC", "Helvetica Neue", Arial, sans-serif; fill: #1A2233; }
  .body       { font: 12px "PingFang SC", "Helvetica Neue", Arial, sans-serif; fill: #1A2233; }
  .body-sm    { font: 11px "PingFang SC", "Helvetica Neue", Arial, sans-serif; fill: #5E6B82; }
  .tier       { font: 700 11px Menlo, Consolas, monospace; fill: #1A2233; }
  .formula    { font: 12px Menlo, Consolas, monospace; fill: #1A2233; }
  .fig-caption{ font: 11.5px "PingFang SC", "Helvetica Neue", Arial, sans-serif; fill: #5E6B82; }
  .annot      { font: italic 10.5px "PingFang SC", Arial, sans-serif; fill: #5E6B82; }
</style>
<defs>
  <marker id="arrInk" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
    <polygon points="0 0, 9 4.5, 0 9" fill="#1A2233"/>
  </marker>
  <marker id="arrGray" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
    <polygon points="0 0, 9 4.5, 0 9" fill="#5E6B82"/>
  </marker>
</defs>
<rect width="960" height="540" fill="#fff"/>
<text x="40" y="32" class="fig-title">定界评分：拓扑距离分级</text>
<line x1="40" y1="42" x2="920" y2="42" stroke="#1A2233" stroke-width="0.6"/>
<text x="40" y="68" class="label">A. 实体匹配分级（UModel 拓扑）</text>
<circle cx="240" cy="230" r="175" fill="#4464f0" fill-opacity="0.10" stroke="#4464f0" stroke-width="0.6"/>
<circle cx="240" cy="230" r="140" fill="#4464f0" fill-opacity="0.20" stroke="#4464f0" stroke-width="0.6"/>
<circle cx="240" cy="230" r="105" fill="#4464f0" fill-opacity="0.35" stroke="#4464f0" stroke-width="0.6"/>
<circle cx="240" cy="230" r="70" fill="#4464f0" fill-opacity="0.55" stroke="#4464f0" stroke-width="0.6"/>
<circle cx="240" cy="230" r="42" fill="#4464f0" fill-opacity="0.70" stroke="#4464f0" stroke-width="0.6"/>
<circle cx="240" cy="230" r="16" fill="#4464f0" stroke="#4464f0" stroke-width="1.2"/>
<text x="240" y="234" text-anchor="middle" class="label" style="fill:#fff">GT</text>
<text x="240" y="258" text-anchor="middle" class="tier" fill="#4464f0">EXACT 1.00</text>
<text x="340" y="100" class="tier" fill="#4464f0">TOPO_3HOP</text>
<text x="340" y="113" class="tier" fill="#4464f0">0.20</text>
<text x="320" y="128" class="tier" fill="#4464f0">TOPO_2HOP</text>
<text x="320" y="141" class="tier" fill="#4464f0">0.30</text>
<text x="295" y="156" class="tier" fill="#4464f0">TOPO_1HOP</text>
<text x="295" y="169" class="tier" fill="#4464f0">0.45</text>
<text x="275" y="184" class="tier" fill="#4464f0">HOST</text>
<text x="275" y="197" class="tier" fill="#4464f0">0.65</text>
<text x="262" y="208" class="tier" fill="#4464f0">RUNTIME</text>
<text x="262" y="221" class="tier" fill="#4464f0">0.80</text>
<line x1="540" y1="58" x2="540" y2="430" stroke="#D1D5DB" stroke-width="0.6"/>
